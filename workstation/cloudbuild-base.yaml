steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.base'
      - '-t'
      - 'us-central1-docker.pkg.dev/drape-mobile-ide/drape-repo/drape-workstation-base:latest'
      - '.'
    timeout: 1800s
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/drape-mobile-ide/drape-repo/drape-workstation-base:latest']

images:
  - 'us-central1-docker.pkg.dev/drape-mobile-ide/drape-repo/drape-workstation-base:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
